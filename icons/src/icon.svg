<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17171F"/>
      <stop offset="1" stop-color="#08080B"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8F9BFF"/>
      <stop offset="1" stop-color="#5A6CFF"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g id="mark" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="92">
    <!-- back chevron: the trader's move -->
    <path d="M318 610 L512 416 L706 610" stroke="#FFFFFF" stroke-opacity="0.28" transform="translate(0 -96)"/>
    <!-- front chevron: our copy -->
    <path d="M318 610 L512 416 L706 610" stroke="url(#acc)" transform="translate(0 96)"/>
